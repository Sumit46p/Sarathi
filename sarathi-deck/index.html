<!DOCTYPE html><html><head><meta charset=utf-8><title>Sarathi - Intelligent Fleet Management Platform</title><style>
html,body{margin:0;height:100%;background:linear-gradient(135deg,#1a2332 0%,#2d3e50 100%);overflow:hidden;font:600 13px system-ui}
#w{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;box-shadow:0 30px 90px rgba(15,26,34,0.5),0 10px 30px rgba(242,84,27,0.15);border-radius:8px;overflow:hidden}
iframe{width:1280px;height:720px;border:0;display:block}
#p{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,#f2541b,#ff7043);transition:.3s;box-shadow:0 2px 8px rgba(242,84,27,0.4);z-index:9999}
#n{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(15,26,34,0.97));backdrop-filter:blur(12px);color:#fff;padding:20px 50px 50px;font:500 17px/1.6 system-ui;display:none;border-top:1px solid rgba(255,255,255,0.1)}
#c{position:fixed;right:20px;bottom:16px;display:flex;gap:10px;align-items:center;z-index:2}
button{padding:8px 16px;border:0;border-radius:8px;background:rgba(15,26,34,0.9);color:#fff;cursor:pointer;font:600 13px system-ui;transition:.2s;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1)}
button:hover{background:#f2541b;transform:translateY(-2px);box-shadow:0 4px 12px rgba(242,84,27,0.4)}
#k{color:#fff;font:700 14px system-ui;padding:8px 14px;background:rgba(255,255,255,0.1);border-radius:6px;backdrop-filter:blur(8px)}
a{color:#f2541b;text-decoration:none;transition:.2s}a:hover{color:#ff7043}
</style></head><body>
<div id=p></div><div id=w><iframe id=f></iframe></div><div id=n></div>
<div id=c><span id=k></span><button onclick="n.style.display=n.style.display?'':'block'">📝 Notes</button><button onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶ Fullscreen</button><button onclick="go(i-1)">‹ Prev</button><button onclick="go(i+1)">Next ›</button></div>
<script>
const N=["Centered title with the real product on stage: React portal login (left) and Flutter driver login (right), both rendered from the actual code, plus a live route map below. Introduce Sarathi: picks the right vehicle by real-road travel time, not straight-line distance, and updates everyone in real time. (30\u201345 s)", "Central scene: pickup in the middle, four vehicles around it. Ambulance 01 is closest in a straight line (2.1 km) but 4.8 km by road - watch the dot take the long way. The others are excluded: off-duty, wrong category, admin blocked. Six problems below. Thesis: the ranking metric is wrong. (50\u201360 s)", "Pivot slide. Sarathi core in the center with live connectors: three roles on the left, six services feeding in from the right. Walk roles then services. Don't linger. (30\u201345 s)", "Interactive architecture, verified against the code. Clients on top; Daphne ASGI gateway; HTTP through middleware to DRF, WebSocket through JWTAuthMiddleware to NotificationConsumer. Services: accounts, dispatch engine, OSRM client, signals. Data: PostgreSQL 16 + PostGIS, Redis 7 (DB 1 cache, DB 2 channels), external OSRM. Trace GPS update: REST save with a 15 m jitter filter, Redis DB 1 cache, dashboard polls every 4-5 s - alerts, not locations, go over WebSocket. Trace dispatch: filter, route, score, explain, then push to the driver. No performance numbers. (about 60\u201375 s)", "The admin portal rendered as a real browser window: sidebar nav, fleet grid, the availability rule banner. is_available = driver on duty AND NOT admin blocked. Safety score 0\u2013100 from harsh-driving events in the last 30 days. Data is sample. (about 50 s)", "Most important slide. Four steps: mandatory filtering, OSRM road routing, multi-factor scoring, decision with explanation. Show the score formula: ETA and distance penalties, with an emergency bonus of 15 when ETA is 10 minutes or less. Switch Normal and Emergency to change the weights, and drag an ETA slider. Vehicle C is closest in km but ranks last. Inputs are illustrative. Over 150 km is rejected; Haversine is the fallback if OSRM is down. (75\u201390 s)", "OSRM returns dense road geometry. The route follows roads, not a straight line. I simplify it with Douglas\u2013Peucker, epsilon 0.0005 degrees, about 55 m. Drag the slider to see raw versus simplified point counts. This geometry is a demo, not real OSRM output. Routes are cached for 30 seconds and Haversine is the fallback. (about 60 s)", "The lifecycle is a formal state machine: pending, assigned, accepted, en_route, arrived, in_service, completed. Assigned can become rejected or expired. A dispatcher can cancel any non-terminal state. Click states to see what triggers each. (about 60 s)", "Follow one GPS fix: the Flutter app posts to update-location, Django filters noise, saves the point, then post_save fires. Redis channel layer (DB 2) delivers to the NotificationConsumer, which pushes to user and org groups. The marker on the dashboard moves. The WebSocket token goes in the query string; anonymous connections get code 4001. No latency numbers claimed. (about 60 s)", "Every phone screen is rendered from the real app UI: Sarathi login with organization dropdown, on-duty toggle, location permission dialog, live GPS, assignment with score, accept, en route with a moving marker, trip completed. Click steps or let it auto-play. (about 70 s)", "More than CRUD. Left, greyed out: a basic system with manual assignment struck through. Right: the three pillars Sarathi adds - dispatch intelligence, real-time operations, production foundations - each backed by a real module. End on the honesty line: no unsupported numbers. (about 60 s)", "Conclusion: fleet, driver, dispatch, routing, real-time, mobile. Then future scope. Thank you, Questions? Mention placeholders still need filling. (45\u201360 s)"];
let i=+location.hash.slice(1)||0;const f=document.getElementById('f'),w=document.getElementById('w');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);w.style.transform=`scale(${s}) translate(-50%,-50%)`}onresize=fit;fit();
function go(x){i=Math.max(0,Math.min(11,x));f.src='s'+String(i+1).padStart(2,'0')+'.html';p.style.width=(i+1)/12*100+'%';k.textContent=(i+1)+' / 12';n.textContent=N[i];location.hash=i}
function key(e){const q=e.key;if(q=='ArrowRight'||q==' '||q=='PageDown')go(i+1);else if(q=='ArrowLeft'||q=='PageUp')go(i-1);else if(q=='Home')go(0);else if(q=='End')go(11);else if(q=='n'||q=='N')n.style.display=n.style.display?'':'block';else if(q=='f'||q=='F')document.documentElement.requestFullscreen()}
addEventListener('keydown',key);addEventListener('message',e=>e.data&&e.data.k&&key({key:e.data.k}));go(i)
</script></body></html>
