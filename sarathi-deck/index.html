
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sarathi - Intelligent Fleet Management Platform</title>

<style>
html,
body {
    margin: 0;
    height: 100%;
    background: linear-gradient(135deg, #1a2332 0%, #2d3e50 100%);
    overflow: hidden;
    font: 600 13px system-ui;
}

#w {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1280px;
    height: 720px;
    transform-origin: 0 0;
    box-shadow:
        0 30px 90px rgba(15,26,34,0.5),
        0 10px 30px rgba(242,84,27,0.15);
    border-radius: 8px;
    overflow: hidden;
}

iframe {
    width: 1280px;
    height: 720px;
    border: 0;
    display: block;
}

#p {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    background: linear-gradient(90deg, #f2541b, #ff7043);
    transition: .3s;
    box-shadow: 0 2px 8px rgba(242,84,27,0.4);
    z-index: 9999;
}

#n {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(15,26,34,0.97)
        );
    backdrop-filter: blur(12px);
    color: #fff;
    padding: 20px 50px 50px;
    font: 500 17px/1.6 system-ui;
    display: none;
    border-top: 1px solid rgba(255,255,255,0.1);
}

#c {
    position: fixed;
    right: 20px;
    bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 2;
}

button {
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    background: rgba(15,26,34,0.9);
    color: #fff;
    cursor: pointer;
    font: 600 13px system-ui;
    transition: .2s;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
}

button:hover {
    background: #f2541b;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(242,84,27,0.4);
}

#k {
    color: #fff;
    font: 700 14px system-ui;
    padding: 8px 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    backdrop-filter: blur(8px);
}

a {
    color: #f2541b;
    text-decoration: none;
    transition: .2s;
}

a:hover {
    color: #ff7043;
}
</style>
</head>

<body>

<div id="p"></div>

<div id="w">
    <iframe id="f"></iframe>
</div>

<div id="n"></div>

<div id="c">
   
    <button onclick="go(i - 1)">
        ‹ Prev
    </button>

    <button onclick="go(i + 1)">
        Next ›
    </button>
</div>

<script>

/* =========================================================
   PRESENTATION CONFIGURATION
   ========================================================= */

const TOTAL = 15;


/* ===============================================

/* =========================================================
   STATE
   ========================================================= */

let i = Number(location.hash.slice(1)) || 0;

const f = document.getElementById("f");
const w = document.getElementById("w");
const p = document.getElementById("p");
const k = document.getElementById("k");
const n = document.getElementById("n");


/* =========================================================
   RESPONSIVE PRESENTATION SCALING
   ========================================================= */

function fit() {

    const s = Math.min(
        innerWidth / 1280,
        innerHeight / 720
    );

    w.style.transform =
        `scale(${s}) translate(-50%, -50%)`;
}

addEventListener("resize", fit);

fit();


/* =========================================================
   GO TO SLIDE
   ========================================================= */

function go(x) {

    /*
       Slide indexes:

       Slide 1  = index 0
       Slide 12 = index 11
       Slide 13 = index 12
       Slide 14 = index 13
    */

    i = Math.max(
        0,
        Math.min(TOTAL - 1, x)
    );

    /*
       Loads:

       s01.html
       s02.html
       ...
       s13.html
       s14.html
    */

    f.src =
        "s" +
        String(i + 1).padStart(2, "0") +
        ".html";


    /* Progress bar */

    p.style.width =
        ((i + 1) / TOTAL * 100) + "%";


    /* Slide counter */

    k.textContent =
        (i + 1) + " / " + TOTAL;


    /* Presenter notes */

    n.textContent =
        N[i] || "";


    /* URL hash */

    location.hash = i;
}





/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

function key(e) {

    const q = e.key;


    /* Next */

    if (
        q === "ArrowRight" ||
        q === " " ||
        q === "PageDown"
    ) {

        go(i + 1);

    }


    /* Previous */

    else if (
        q === "ArrowLeft" ||
        q === "PageUp"
    ) {

        go(i - 1);

    }


    /* First slide */

    else if (q === "Home") {

        go(0);

    }


    /* Last slide */

    else if (q === "End") {

        go(TOTAL - 1);

    }


    /* Notes */

    else if (
        q === "n" ||
        q === "N"
    ) {

        toggleNotes();

    }


    /* Fullscreen */

    else if (
        q === "f" ||
        q === "F"
    ) {

        toggleFullscreen();

    }

}


/* =========================================================
   KEYBOARD LISTENER
   ========================================================= */

addEventListener(
    "keydown",
    key
);


/* =========================================================
   ALLOW INDIVIDUAL SLIDES TO SEND KEY EVENTS
   ========================================================= */

addEventListener(
    "message",
    e => {

        if (
            e.data &&
            e.data.k
        ) {

            key({
                key: e.data.k
            });

        }

    }
);


/* =========================================================
   START PRESENTATION
   ========================================================= */

go(i);

</script>

</body>
</html>
