<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="theme.css">
    <script src="slide.js" defer></script>

    <style>
        .arrow-bar {
            background: var(--am);
            clip-path: polygon(
                0% 0%,
                calc(100% - 22px) 0%,
                100% 50%,
                calc(100% - 22px) 100%,
                0% 100%
            );
            display: flex;
            align-items: center;
            padding-left: 24px;
            color: #fff;
            font-family: "Schibsted Grotesk";
            font-weight: 800;
            font-size: 14px;
            height: 43px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

<!-- CATEGORY -->
<p class="s u"
   style="
      --d:.05s;
      text-align:center;
      color:var(--am);
      font-family:'IBM Plex Mono';
      font-size:11px;
      font-weight:700;
      letter-spacing:1.8px;
      margin:8px 0 8px;
   ">
    REAL-TIME CONTROL
</p>

<!-- MAIN HEADING — OUTSIDE THE BOX -->
<h2 class="u"
    style="
       --d:.12s;
       text-align:center;
       font-size:40px;
       line-height:1.12;
       margin:0 auto;
       max-width:1050px;
       color:#17232a;
    ">
    Real-time telemetry turns the map into an
    <span style="color:var(--am)">operating picture</span>
</h2>

<!-- SUBTITLE -->
<p class="s u"
   style="
      --d:.18s;
      text-align:center;
      color:#5d6b73;
      font-size:13px;
      margin:10px auto 18px;
   ">
    Signals from the field become current, actionable context for dispatch.
</p>


<!-- TELEMETRY PIPELINE BOX -->
<div class="k u"
     style="
        --d:.25s;
        width:1120px;
        margin:0 auto;
        padding:24px 30px 26px;
        box-sizing:border-box;
     ">

    <!-- Small technical label -->
    <div class="u"
         style="
            --d:.3s;
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:18px;
         ">

        <span style="
            font-family:'IBM Plex Mono';
            font-size:10px;
            font-weight:700;
            letter-spacing:1.4px;
            color:var(--am);
        ">
            TELEMETRY FLOW
        </span>

        <span style="
            font-family:'IBM Plex Mono';
            font-size:10px;
            color:#7a878d;
        ">
            FIELD → DISPATCH
        </span>

    </div>


    <!-- Pipeline -->
    <div style="
        display:flex;
        flex-direction:column;
        gap:10px;
    ">

        <!-- Event Ingress -->
        <div class="u arrow-bar"
             style="--d:.35s; width:78%;">
            Event Ingress
        </div>

        <!-- Django Processing -->
        <div class="u arrow-bar"
             style="--d:.4s; width:84%;">
            Django Processing
        </div>

        <!-- Redis Channels -->
        <div class="u arrow-bar"
             style="--d:.45s; width:90%;">
            Redis Channels
        </div>

        <!-- Dispatcher Dashboard -->
        <div class="u arrow-bar"
             style="--d:.5s; width:96%;">
            Dispatcher Dashboard
        </div>

    </div>


    <!-- Bottom technical note -->
    <div class="u"
         style="
            --d:.6s;
            margin-top:18px;
            padding-top:12px;
            border-top:1px solid #d9dfe2;
            display:flex;
            justify-content:flex-end;
         ">

        <span style="
            font-family:'IBM Plex Mono';
            font-size:10px;
            color:#69777e;
        ">
            real-time signal propagation
        </span>

    </div>

</div>

</body>
</html>
