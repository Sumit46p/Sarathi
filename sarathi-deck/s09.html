<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="theme.css">
    <script src="slide.js" defer></script>

    <style>
        .visual {
            display: grid;
            grid-template-columns: 1fr 400px 1fr;
            grid-template-rows: 1fr auto 1fr auto;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .loop-wrap {
            grid-column: 2;
            grid-row: 1 / 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loop-label {
            position: relative;
            font-size: 13px;
            line-height: 1.35;
            font-weight: 750;
            color: #17232a;
        }

        .label-tl {
            grid-column: 1;
            grid-row: 1;
            justify-self: end;
            align-self: end;
            text-align: right;
            padding: 0 28px 18px 0;
        }

        .label-bl {
            grid-column: 1;
            grid-row: 3;
            justify-self: end;
            align-self: start;
            text-align: right;
            padding: 18px 28px 0 0;
        }

        .label-tr {
            grid-column: 3;
            grid-row: 1;
            justify-self: start;
            align-self: end;
            text-align: left;
            padding: 0 0 18px 28px;
        }

        .label-br {
            grid-column: 3;
            grid-row: 3;
            justify-self: start;
            align-self: start;
            text-align: left;
            padding: 18px 0 0 28px;
        }

        .caption {
            grid-column: 1 / 4;
            grid-row: 4;
            justify-self: center;
            font-family: "IBM Plex Mono";
            font-size: 9.5px;
            letter-spacing: 1px;
            color: #7a878d;
            padding-top: 4px;
        }
    </style>
</head>

<body>

<!-- CATEGORY -->
<p class="s u"
   style="
      --d:.05s;
      text-align:center;
      color:var(--am);
      font-family:'IBM Plex Mono';
      font-size:11px;
      font-weight:700;
      letter-spacing:1.8px;
      margin:8px 0 8px;
   ">
    FLEET CONTROL
</p>

<!-- HEADING -->
<h2 class="u"
    style="
       --d:.12s;
       text-align:center;
       font-size:40px;
       line-height:1.12;
       margin:0 auto;
       max-width:1050px;
       color:#17232a;
    ">
    Fleet and driver controls make
    <span style="color:var(--am)">availability explicit</span>
</h2>

<!-- DESCRIPTION -->
<p class="s u"
   style="
      --d:.18s;
      text-align:center;
      color:#5d6b73;
      font-size:14px;
      line-height:1.5;
      max-width:900px;
      margin:10px auto 20px;
   ">
    Availability is derived from on-duty status and administrative blocking,
    then enriched with telemetry and safety signals.
</p>


<!-- MAIN VISUAL -->
<div class="k u"
     style="
        --d:.25s;
        width:1120px;
        max-width:100%;
        height:240px;
        margin:0 auto;
        padding:16px 24px 12px;
        position:relative;
        overflow:hidden;
     ">

    <div class="visual">

        <!-- TOP LEFT -->
        <div class="loop-label u label-tl"
             style="--d:.35s;">
            Driver<br>Availability
        </div>


        <!-- BOTTOM LEFT -->
        <div class="loop-label u label-bl"
             style="--d:.42s;">
            Dispatch<br>Assignment
        </div>


        <!-- INFINITY LOOP
             KEPT EXACTLY AS PROVIDED -->
        <div class="loop-wrap u"
             style="--d:.3s;">

            <svg width="400"
                 height="164"
                 viewBox="0 0 367 150"
                 fill="none"
                 xmlns="http://www.w3.org/2000/svg"
                 overflow="visible"
                 aria-hidden="true">

                <path
                    d="M106.667 137.5
                       C65.3333 137.5 29.1667 108.333 29.1667 75
                       C29.1667 41.6667 65.3333 12.5 106.667 12.5
                       C148 12.5 173.333 58.3333 183.333 75
                       C193.333 91.6667 218.667 137.5 260 137.5
                       C301.333 137.5 337.5 108.333 337.5 75
                       C337.5 41.6667 301.333 12.5 260 12.5
                       C218.667 12.5 193.333 58.3333 183.333 75
                       C173.333 91.6667 148 137.5 106.667 137.5Z"
                    stroke="var(--am)"
                    stroke-width="22"
                    stroke-linecap="round"
                    stroke-linejoin="round"/>

                <rect
                    x="87.7"
                    y="56"
                    width="38"
                    height="38"
                    rx="4"
                    fill="#f1f5f9"/>

                <circle
                    cx="106.7"
                    cy="69"
                    r="4"
                    fill="#cbd5e1"/>

                <path
                    d="M93.7 86L102.7 75L109.7 81L117.7 71L125.7 86H93.7Z"
                    fill="#cbd5e1"/>

                <rect
                    x="241"
                    y="56"
                    width="38"
                    height="38"
                    rx="4"
                    fill="#f1f5f9"/>

                <circle
                    cx="260"
                    cy="69"
                    r="4"
                    fill="#cbd5e1"/>

                <path
                    d="M247 86L256 75L263 81L271 71L279 86H247Z"
                    fill="#cbd5e1"/>

            </svg>

        </div>


        <!-- TOP RIGHT -->
        <div class="loop-label u label-tr"
             style="--d:.38s;">
            Vehicle Records
        </div>


        <!-- BOTTOM RIGHT -->
        <div class="loop-label u label-br"
             style="--d:.45s;">
            Safety Scoring
        </div>


        <!-- CAPTION -->
        <div class="caption u"
             style="--d:.55s;">
            CONTINUOUS FLEET STATE
        </div>

    </div>

</div>

</body>
</html>
